<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuttab Live Tutor</title>
<style>
:root {
  --bg: #faf8f4; --surface: #ffffff; --surface-2: #f2efe8; --text: #1f1d1a; --muted: #6b665d;
  --border: #e2ddd2; --primary: #1f6f5c; --primary-text: #fff; --primary-soft: #e3f1ec;
  --ok: #1f7a3f; --ok-soft: #e5f4ea; --bad: #b3261e; --bad-soft: #fbe9e7; --warn: #8a5a00; --warn-soft: #fff4dc;
  --a: #1f6f5c; --b: #c26a1b; --radius: 10px;
  --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 2px 8px rgb(0 0 0 / .04);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161513; --surface: #1f1e1b; --surface-2: #2a2825; --text: #ece8e1; --muted: #a39d92;
    --border: #3a3733; --primary: #4fb597; --primary-text: #0d1a16; --primary-soft: #1d3530;
    --ok-soft: #173322; --bad-soft: #3a1c1a; --warn-soft: #362a12; --a: #4fb597; --b: #e0924a; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); display: flex; flex-direction: column; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 12px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
.btn.small { padding: 3px 9px; font-size: 13px; }
.muted { color: var(--muted); }

/* top bar */
header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-block-end: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.brand { font-weight: 700; color: var(--primary); }
.track { font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; }
.seg button.on { background: var(--primary); color: var(--primary-text); }
.spacer { flex: 1; }

/* plan stepper */
.plan { display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto; border-block-end: 1px solid var(--border); }
.step { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; color: var(--muted); }
.step .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.step.done .dot { background: var(--ok); }
.step.now { background: var(--primary-soft); color: var(--text); font-weight: 600; }
.step.now .dot { background: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

/* main split: tutor at the start side, board at the end side (flips with dir) */
main { flex: 1; display: grid; grid-template-columns: minmax(320px, 2fr) 3fr; min-height: 0; }
.tutor { display: flex; flex-direction: column; border-inline-end: 1px solid var(--border); min-height: 0; background: var(--surface); }
.board { display: flex; flex-direction: column; min-height: 0; }

/* chat */
.chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 9px 12px; border-radius: 12px; position: relative; }
.msg.ai { background: var(--surface-2); align-self: flex-start; border-start-start-radius: 4px; }
.msg.me { background: var(--primary); color: var(--primary-text); align-self: flex-end; border-start-end-radius: 4px; }
.msg .tools { display: flex; gap: 6px; margin-block-start: 6px; }
.msg .tools button { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 0; }
.msg.speaking { outline: 2px solid var(--primary); }
.note { align-self: center; font-size: 12px; color: var(--warn); background: var(--warn-soft); padding: 4px 10px; border-radius: 999px; }
.note.ok { color: var(--ok); background: var(--ok-soft); }
.choices { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: 8px; }
.composer { border-block-start: 1px solid var(--border); padding: 10px; display: flex; gap: 8px; align-items: center; }
.composer input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--text); font: inherit; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; }
.iconbtn.rec { background: var(--bad); color: #fff; border-color: var(--bad); }
.quick { display: flex; gap: 6px; padding: 0 10px 10px; flex-wrap: wrap; }
.quick button { font-size: 12px; }

/* orb */
.orbwrap { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; }
body.voice .chat, body.voice .composer { display: none; }
body.voice .orbwrap { display: flex; }
.orb { width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #9be3cc, var(--primary) 55%, #0f3d33 100%);
  box-shadow: 0 0 60px color-mix(in srgb, var(--primary) 45%, transparent);
  transition: transform .08s linear, filter .3s; }
.orb.listening { filter: hue-rotate(160deg); animation: breathe 1.6s ease-in-out infinite; }
.orb.thinking { animation: spin 1.2s linear infinite; background: conic-gradient(from 0deg, var(--primary), #9be3cc, var(--primary)); }
.orb.idle { animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.05); } }
@keyframes spin { to { transform: rotate(360deg); } }
.state { font-size: 13px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.caption { min-height: 3em; max-width: 34ch; text-align: center; font-size: 18px; }
.orbctl { display: flex; gap: 10px; }

/* board */
.boardbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-block-end: 1px solid var(--border); }
.stage { flex: 1; overflow: auto; padding: 24px; display: grid; place-items: center; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 28px; width: min(640px, 100%); animation: rise .35s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.card h2 { margin: 0 0 8px; }
.pies { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; font-size: 28px; font-weight: 600; }
.pie { text-align: center; font-size: 15px; }
.pie svg path { transition: fill .5s; }
.eq { font-size: 30px; text-align: center; font-weight: 600; direction: ltr; }
.eq .hi { color: var(--b); }
.imgph { height: 180px; border-radius: 10px; background: repeating-linear-gradient(45deg, var(--surface-2) 0 12px, var(--bg) 12px 24px); display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.src { font-size: 12px; color: var(--muted); margin-block-start: 12px; }
.thumbs { display: flex; gap: 6px; padding: 8px 16px; border-block-start: 1px solid var(--border); overflow-x: auto; }
.thumb { flex: none; width: 70px; height: 46px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 11px; display: grid; place-items: center; color: var(--muted); }
.thumb.on { border-color: var(--primary); color: var(--text); }

/* level meter */
.level { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.meter { width: 90px; height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; }
.meter i { position: absolute; inset-block: -3px; width: 12px; border-radius: 6px; background: var(--primary); transition: inset-inline-start .5s; }

/* builder modal */
.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: none; place-items: center; padding: 16px; z-index: 5; }
.modal.open { display: grid; }
.sheet { background: var(--surface); border-radius: 14px; padding: 22px; width: min(620px, 100%); max-height: 90vh; overflow: auto; box-shadow: var(--shadow); }
.sheet h3 { margin-top: 0; }
.sheet input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; background: var(--bg); color: var(--text); font: inherit; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.opt { border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: start; background: var(--surface); }
.opt.on { border-color: var(--primary); background: var(--primary-soft); }
.log { font-size: 13px; color: var(--muted); margin: 10px 0; }
.log div::before { content: "✓ "; color: var(--ok); }
.sections { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.sec { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.sec b { display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .tutor { border-inline-end: 0; border-block-end: 1px solid var(--border); }
  .opts { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <span class="brand" data-t="brand"></span>
  <span class="track" id="trackName"></span>
  <span class="spacer"></span>
  <div class="level" title=""><span data-t="level"></span><div class="meter"><i id="levelDot"></i></div><span id="levelTxt"></span></div>
  <div class="seg" id="modeSeg"><button data-mode="chat" class="on" data-t="chat"></button><button data-mode="orb" data-t="voice"></button></div>
  <div class="seg" id="langSeg"><button data-lang="en" class="on">EN</button><button data-lang="ar">ع</button></div>
  <button class="btn" id="newTrack" data-t="newTrack"></button>
</header>
<nav class="plan" id="plan"></nav>
<main>
  <section class="tutor">
    <div class="chat" id="chat"></div>
    <div class="orbwrap">
      <div class="state" id="orbState"></div>
      <div class="orb idle" id="orb"></div>
      <div class="caption" id="caption"></div>
      <div class="orbctl">
        <button class="iconbtn" id="orbMic" title="Talk">🎙</button>
        <button class="btn" id="orbInterrupt" data-t="interrupt"></button>
        <button class="btn" id="orbPause" data-t="pause"></button>
      </div>
    </div>
    <div class="quick" id="quick"></div>
    <div class="composer">
      <button class="iconbtn" id="mic" title="Speak">🎙</button>
      <input id="input" autocomplete="off">
      <button class="btn primary" id="send" data-t="send"></button>
    </div>
  </section>
  <section class="board">
    <div class="boardbar">
      <b data-t="board"></b><span class="spacer"></span>
      <label class="muted" style="font-size:13px"><input type="checkbox" id="autoRead" checked> <span data-t="autoRead"></span></label>
      <button class="btn small" id="next" data-t="continue"></button>
    </div>
    <div class="stage" id="stage"></div>
    <div class="thumbs" id="thumbs"></div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 data-t="builderTitle"></h3>
    <div class="opts">
      <button class="opt" data-src="pack"><b data-t="optPack"></b><div class="muted" data-t="optPackNote"></div></button>
      <button class="opt on" data-src="web"><b data-t="optWeb"></b><div class="muted" data-t="optWebNote"></div></button>
    </div>
    <input id="topic">
    <div class="log" id="log"></div>
    <div class="sections" id="sections"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end">
      <button class="btn" id="cancel" data-t="cancel"></button>
      <button class="btn primary" id="build" data-t="build"></button>
    </div>
  </div>
</div>

<script>
const T = {
  en: {
    brand: "Kuttab", level: "Level", chat: "Chat", voice: "Voice", newTrack: "+ New track", interrupt: "Interrupt", pause: "Pause",
    send: "Send", board: "Board", autoRead: "Read replies aloud", continue: "Continue ▸", placeholder: "Ask, answer, or say “explain again”…",
    builderTitle: "What do you want to learn?", optPack: "Take a ready track", optPackNote: "From an installed pack. No web needed.",
    optWeb: "Build a new track", optWebNote: "The tutor researches once, then teaches from that.", topicPh: "e.g. Adding fractions with different bottoms",
    cancel: "Cancel", build: "Research and plan", start: "Start learning",
    track: "Fractions: adding unlike fractions",
    states: { idle: "Ready", listening: "Listening…", thinking: "Thinking…", speaking: "Speaking" },
    quick: ["Explain again", "Give an example", "Too easy", "Too hard", "Check on the web"],
    levels: ["Gentle", "Steady", "Fast"],
    slower: "Adapting: slower pace, one more picture", faster: "Adapting: skipping the basics",
    web: "Looked this up once and added 2 sources to the track",
    log: ["Searched 3 queries", "Read 9 pages, kept 6 sources", "Saved the resource pack locally", "Built 5 sections with goals and checks"],
    sources: "sources",
    plan: ["What a fraction is", "Same bottoms", "Different bottoms", "Finding a common bottom", "Practice and review"],
    secSrc: [["Khan Academy", "Wikipedia"], ["Math is Fun"], ["Khan Academy", "BBC Bitesize"], ["Math is Fun", "OpenStax"], ["Your mistakes so far"]],
    reply: "Good question. Think of it as cutting both pizzas into the same size of slice, so we can count them together.",
  },
  ar: {
    brand: "كُتّاب", level: "المستوى", chat: "محادثة", voice: "صوت", newTrack: "+ مسار جديد", interrupt: "مقاطعة", pause: "إيقاف مؤقت",
    send: "إرسال", board: "اللوح", autoRead: "قراءة الردود بصوت", continue: "متابعة ◂", placeholder: "اسأل، أجب، أو قل «اشرح مرة أخرى»…",
    builderTitle: "ماذا تريد أن تتعلم؟", optPack: "خذ مسارًا جاهزًا", optPackNote: "من حزمة مثبتة. لا حاجة للإنترنت.",
    optWeb: "ابنِ مسارًا جديدًا", optWebNote: "يبحث المعلم مرة واحدة، ثم يشرح منها.", topicPh: "مثال: جمع الكسور ذات المقامات المختلفة",
    cancel: "إلغاء", build: "ابحث وخطّط", start: "ابدأ التعلم",
    track: "الكسور: جمع كسور بمقامات مختلفة",
    states: { idle: "جاهز", listening: "أستمع…", thinking: "أفكر…", speaking: "أتحدث" },
    quick: ["اشرح مرة أخرى", "أعطني مثالًا", "سهل جدًا", "صعب جدًا", "تحقق من الإنترنت"],
    levels: ["هادئ", "متوسط", "سريع"],
    slower: "تكيّف: إبطاء الشرح وإضافة صورة", faster: "تكيّف: تخطي الأساسيات",
    web: "بحثت مرة واحدة وأضفت مصدرين إلى المسار",
    log: ["بحثت بثلاث عبارات", "قرأت 9 صفحات واحتفظت بـ 6 مصادر", "حفظت حزمة المصادر على الجهاز", "بنيت 5 أقسام بأهداف واختبارات"],
    sources: "مصادر",
    plan: ["ما هو الكسر", "مقامات متساوية", "مقامات مختلفة", "إيجاد مقام مشترك", "تمرين ومراجعة"],
    secSrc: [["أكاديمية خان", "ويكيبيديا"], ["Math is Fun"], ["أكاديمية خان", "BBC Bitesize"], ["Math is Fun", "OpenStax"], ["أخطاؤك حتى الآن"]],
    reply: "سؤال جيد. تخيّل أننا نقطع البيتزا الاثنتين إلى قطع بالحجم نفسه، حتى نعدّها معًا.",
  },
};

// The lesson the agent "teaches" for section 3. Each beat = what it says + what it puts on the board.
const BEATS = {
  en: [
    { say: "Let's add one half and one third. Here they are as two pizzas.", board: { kind: "pies", pies: [[2, 1, "a", "1/2"], [3, 1, "b", "1/3"]], op: "+" } },
    { say: "The slices are different sizes, so we can't just count them. Halves and thirds don't match.", board: { kind: "eq", html: "1/2 + 1/3 ≠ 2/5" } },
    { say: "Quick check: which number can both 2 and 3 divide into?", ask: ["4", "6", "5"], right: 1 },
    { say: "Yes, six. Cut both pizzas into sixths. One half becomes three sixths, one third becomes two sixths.", board: { kind: "pies", pies: [[6, 3, "a", "3/6"], [6, 2, "b", "2/6"]], op: "+" } },
    { say: "Now the slices match, so we just count: three plus two is five sixths.", board: { kind: "pies", pies: [[6, 5, "mix", "5/6"]], op: "" , eq: "3/6 + 2/6 = <span class=hi>5/6</span>" } },
    { say: "In real life: if you drink half a bottle in the morning and a third after lunch, you've had five sixths of it.", board: { kind: "img", note: "Picture the tutor makes or finds: a bottle with 5/6 shaded", src: "Math is Fun · Adding Fractions" } },
  ],
  ar: [
    { say: "لنجمع نصفًا وثلثًا. هذه هما على شكل بيتزا.", board: { kind: "pies", pies: [[2, 1, "a", "1/2"], [3, 1, "b", "1/3"]], op: "+" } },
    { say: "القطع ليست بالحجم نفسه، لذلك لا يمكننا عدّها مباشرة. الأنصاف والأثلاث لا تتطابق.", board: { kind: "eq", html: "1/2 + 1/3 ≠ 2/5" } },
    { say: "سؤال سريع: ما العدد الذي يقبل القسمة على 2 و3 معًا؟", ask: ["4", "6", "5"], right: 1 },
    { say: "صحيح، ستة. نقطع البيتزا الاثنتين إلى أسداس. النصف يصبح ثلاثة أسداس، والثلث يصبح سدسين.", board: { kind: "pies", pies: [[6, 3, "a", "3/6"], [6, 2, "b", "2/6"]], op: "+" } },
    { say: "الآن القطع متطابقة، فنعدّها: ثلاثة زائد اثنين يساوي خمسة أسداس.", board: { kind: "pies", pies: [[6, 5, "mix", "5/6"]], op: "", eq: "3/6 + 2/6 = <span class=hi>5/6</span>" } },
    { say: "في الحياة: إذا شربت نصف زجاجة صباحًا وثلثها بعد الغداء، فقد شربت خمسة أسداسها.", board: { kind: "img", note: "صورة يصنعها المعلم أو يجدها: زجاجة مظلل منها 5/6", src: "Math is Fun · جمع الكسور" } },
  ],
};

let lang = "en", mode = "chat", beat = -1, level = 1, boards = [], speaking = false, paused = false;
const $ = (id) => document.getElementById(id);
const t = () => T[lang];

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t()[el.dataset.t]));
  $("input").placeholder = t().placeholder;
  $("topic").placeholder = t().topicPh;
  $("trackName").textContent = t().track;
  $("quick").innerHTML = "";
  t().quick.forEach((q, i) => {
    const b = document.createElement("button");
    b.className = "btn small"; b.textContent = q; b.onclick = () => quick(i);
    $("quick").append(b);
  });
  renderPlan(); setLevel(level); setOrb("idle");
}

function renderPlan() {
  $("plan").innerHTML = t().plan.map((p, i) =>
    `<span class="step ${i < 2 ? "done" : i === 2 ? "now" : ""}"><span class="dot"></span>${i + 1}. ${p}</span>`).join("");
}

function setLevel(l) {
  level = Math.max(0, Math.min(2, l));
  $("levelDot").style.insetInlineStart = `${level * 39}px`;
  $("levelTxt").textContent = t().levels[level];
}

function setOrb(s) {
  $("orb").className = "orb " + s;
  $("orbState").textContent = t().states[s];
}

// --- speech: real browser TTS when available, with a fake amplitude for the orb
function say(text, done) {
  if (paused) return;
  speaking = true; setOrb("speaking"); $("caption").textContent = "";
  const words = text.split(" ");
  let w = 0;
  const pulse = setInterval(() => { $("orb").style.transform = `scale(${1 + Math.random() * 0.12})`; }, 90);
  const finish = () => { clearInterval(pulse); clearInterval(cap); $("orb").style.transform = ""; speaking = false; setOrb("idle"); done && done(); };
  const cap = setInterval(() => { if (w < words.length) $("caption").textContent = words.slice(Math.max(0, w - 9), ++w).join(" "); }, 260);
  if ($("autoRead").checked && "speechSynthesis" in window) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === "ar" ? "ar-SA" : "en-US";
    u.onend = finish; u.onerror = finish;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } else setTimeout(finish, words.length * 260 + 300);
}

function addMsg(who, text, extra) {
  const m = document.createElement("div");
  m.className = "msg " + who;
  m.textContent = text;
  if (who === "ai") {
    const tools = document.createElement("div"); tools.className = "tools";
    tools.innerHTML = `<button>🔊 ${lang === "ar" ? "استمع" : "Listen"}</button>`;
    tools.firstChild.onclick = () => { m.classList.add("speaking"); say(text, () => m.classList.remove("speaking")); };
    m.append(tools);
  }
  if (extra) m.append(extra);
  $("chat").append(m); $("chat").scrollTop = 1e9;
  return m;
}
function addNote(text, ok) {
  const n = document.createElement("div"); n.className = "note" + (ok ? " ok" : ""); n.textContent = text;
  $("chat").append(n); $("chat").scrollTop = 1e9;
}

// --- board
function pieSvg(n, k, color) {
  const r = 46, c = 50, fill = color === "mix" ? null : `var(--${color})`;
  let p = "";
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * 2 * Math.PI - Math.PI / 2, a1 = ((i + 1) / n) * 2 * Math.PI - Math.PI / 2;
    const f = i < k ? (fill || (i < 3 ? "var(--a)" : "var(--b)")) : "var(--surface-2)";
    p += n === 1 ? `<circle cx=50 cy=50 r=46 fill="${f}"/>` :
      `<path d="M${c},${c} L${c + r * Math.cos(a0)},${c + r * Math.sin(a0)} A${r},${r} 0 0 1 ${c + r * Math.cos(a1)},${c + r * Math.sin(a1)} Z" fill="${f}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  return `<svg width="120" height="120" viewBox="0 0 100 100">${p}</svg>`;
}
function renderBoard(b) {
  let h = "";
  if (b.kind === "pies") {
    h = `<div class="pies">${b.pies.map((p, i) => `${i ? `<span>${b.op}</span>` : ""}<div class="pie">${pieSvg(p[0], p[1], p[2])}<div dir="ltr">${p[3]}</div></div>`).join("")}</div>`;
    if (b.eq) h += `<p class="eq">${b.eq}</p>`;
  } else if (b.kind === "eq") h = `<p class="eq">${b.html}</p>`;
  else if (b.kind === "img") h = `<div class="imgph">${b.note}</div><div class="src">${t().sources}: ${b.src}</div>`;
  else if (b.kind === "ask") h = `<h2>?</h2><p>${b.q}</p>`;
  $("stage").innerHTML = `<div class="card">${h}</div>`;
}
function pushBoard(b) {
  boards.push(b); renderBoard(b);
  $("thumbs").innerHTML = boards.map((_, i) => `<button class="thumb ${i === boards.length - 1 ? "on" : ""}" data-i="${i}">${i + 1}</button>`).join("");
  $("thumbs").querySelectorAll(".thumb").forEach((el) => (el.onclick = () => {
    renderBoard(boards[el.dataset.i]);
    $("thumbs").querySelectorAll(".thumb").forEach((x) => x.classList.toggle("on", x === el));
  }));
}

// --- the teaching loop
function nextBeat() {
  if (speaking || paused) return;
  const b = BEATS[lang][++beat];
  if (!b) { addNote(lang === "ar" ? "انتهى القسم. التالي: إيجاد مقام مشترك" : "Section done. Next: finding a common bottom", true); return; }
  setOrb("thinking");
  setTimeout(() => {
    if (b.board) pushBoard(b.board);
    let extra;
    if (b.ask) {
      pushBoard({ kind: "ask", q: b.say });
      extra = document.createElement("div"); extra.className = "choices";
      b.ask.forEach((a, i) => {
        const btn = document.createElement("button"); btn.className = "btn small"; btn.textContent = a;
        btn.onclick = () => answer(i === b.right, a, extra);
        extra.append(btn);
      });
    }
    addMsg("ai", b.say, extra);
    say(b.say, () => { if (!b.ask) setTimeout(nextBeat, 700); });
  }, 600);
}
function answer(right, a, box) {
  box.querySelectorAll("button").forEach((b) => (b.disabled = true));
  addMsg("me", a);
  if (right) { setLevel(level + (level < 2 ? 0 : 0)); nextBeat(); }
  else {
    setLevel(level - 1); addNote(t().slower);
    const hint = lang === "ar" ? "ليس تمامًا. عدّ بالاثنين: 2، 4، 6. وبالثلاثة: 3، 6. أين يلتقيان؟" : "Not quite. Count by twos: 2, 4, 6. By threes: 3, 6. Where do they meet?";
    pushBoard({ kind: "eq", html: "2, 4, <span class=hi>6</span>, 8 … &nbsp; 3, <span class=hi>6</span>, 9 …" });
    addMsg("ai", hint); say(hint, () => box.querySelectorAll("button").forEach((b) => (b.disabled = false)));
  }
}
function quick(i) {
  const q = t().quick[i];
  addMsg("me", q);
  if (i === 2) { setLevel(level + 1); addNote(t().faster); beat = Math.max(beat, 3); nextBeat(); }
  else if (i === 3) { setLevel(level - 1); addNote(t().slower); beat = Math.max(-1, beat - 1); nextBeat(); }
  else if (i === 4) { addNote(t().web, true); reply(); }
  else { beat = Math.max(-1, beat - 1); nextBeat(); }
}
function reply() { setOrb("thinking"); setTimeout(() => { addMsg("ai", t().reply); say(t().reply); }, 700); }

// --- wiring
$("send").onclick = () => { const v = $("input").value.trim(); if (!v) return; $("input").value = ""; addMsg("me", v); reply(); };
$("input").onkeydown = (e) => e.key === "Enter" && $("send").onclick();
$("next").onclick = nextBeat;
function micToggle(btn) {
  if (btn.classList.toggle("rec")) { speechSynthesis?.cancel(); setOrb("listening"); }
  else { setOrb("thinking"); addMsg("me", lang === "ar" ? "(كلام) لماذا لا نجمع المقامات؟" : "(spoken) why can't we add the bottoms?"); reply(); }
}
$("mic").onclick = () => micToggle($("mic"));
$("orbMic").onclick = () => micToggle($("orbMic"));
$("orbInterrupt").onclick = () => { speechSynthesis?.cancel(); micToggle($("orbMic")); };
$("orbPause").onclick = () => { paused = !paused; if (paused) speechSynthesis?.cancel(); $("orbPause").textContent = paused ? "▶" : t().pause; };
$("modeSeg").onclick = (e) => {
  const m = e.target.dataset.mode; if (!m) return; mode = m;
  document.body.classList.toggle("voice", m === "orb");
  $("modeSeg").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
};
$("langSeg").onclick = (e) => {
  const l = e.target.dataset.lang; if (!l || l === lang) return; lang = l;
  $("langSeg").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.lang === l));
  speechSynthesis?.cancel(); $("chat").innerHTML = ""; boards = []; beat = -1; $("thumbs").innerHTML = "";
  applyLang(); start();
};

// track builder
$("newTrack").onclick = () => { $("modal").classList.add("open"); $("log").innerHTML = ""; $("sections").innerHTML = ""; $("build").textContent = t().build; $("build").dataset.ready = ""; };
$("cancel").onclick = () => $("modal").classList.remove("open");
document.querySelectorAll(".opt").forEach((o) => (o.onclick = () => document.querySelectorAll(".opt").forEach((x) => x.classList.toggle("on", x === o))));
$("build").onclick = () => {
  if ($("build").dataset.ready) { $("modal").classList.remove("open"); return; }
  $("log").innerHTML = ""; $("sections").innerHTML = "";
  t().log.forEach((l, i) => setTimeout(() => {
    $("log").insertAdjacentHTML("beforeend", `<div>${l}</div>`);
    if (i === t().log.length - 1) {
      $("sections").innerHTML = t().plan.map((p, j) =>
        `<div class="sec"><b>${j + 1}. ${p}</b><div class="chips">${t().secSrc[j].map((s) => `<span class="chip">${s}</span>`).join("")}</div></div>`).join("");
      $("build").textContent = t().start; $("build").dataset.ready = "1";
    }
  }, 500 * (i + 1)));
};

function start() {
  pushBoard({ kind: "eq", html: lang === "ar" ? "القسم 3: مقامات مختلفة" : "Section 3: different bottoms" });
  const hi = lang === "ar" ? "أهلًا مجددًا! في المرة الماضية أتقنت جمع الكسور ذات المقامات المتساوية. اليوم نجمع كسورًا بمقامات مختلفة. اضغط «متابعة» أو قل «ابدأ»." :
    "Welcome back! Last time you got same-bottom fractions right. Today: adding fractions with different bottoms. Press Continue or just say “go”.";
  addMsg("ai", hi);
}
applyLang(); start();
</script>
