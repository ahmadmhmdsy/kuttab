name: context
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/selftest.py
      - run: python scripts/validate_context.py --root .
      - run: python scripts/rotate.py --root . --check
